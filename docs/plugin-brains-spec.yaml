spec: plug-in brains (persona knowledge packs — deterministic lexical retrieval over Atlantis-built corpora)
status: proposed              # 2026-07-02 — raised with the developer and approved in-session ("I dig the hell out of the idea"); Phase 2a of the brains axis. Embedding retrieval (Phase 2b) is explicitly OUT of this spec.
date: 2026-07-02
depends_on:
  - docs/stemming-spec.yaml            # land FIRST — the brain union index builds on tokenize(); baselining the brain eval probes against the final tokenizer avoids a mid-build ratchet re-baseline
  - C:/projects/Atlantis-SGC           # sibling repo — the offline compiler. Contract is the brain-pack JSON below, nothing else crosses.
goal: >
  Let a chat mount one or more "brains" — JSON packs of salience-annotated
  document chunks compiled offline by Atlantis — retrieved at turn time by the
  SAME deterministic engine style as Grepory (TF-IDF cosine, client-side, 0 ms,
  0 tokens) and rendered as a new PERSONA KNOWLEDGE prompt tier. Knowledge is a
  separate axis from memory: the three memory tiers are untouched. No model
  anywhere at runtime; no model required at build time either (Atlantis --stub
  is a first-class, fully deterministic path — Gemma classification is optional
  enrichment whose outputs are auditable YAML frontmatter).

invariant_check:
  no_model_in_retrieval: runtime retrieval is tokenize/TF-IDF/cosine reusing tfidf.ts exports verbatim. Chroma and MiniLM embeddings are NOT consumed — the pack is plain text + lexical metadata. Embedding retrieval remains a phase change (Phase 2b, separate spec, head-to-head eval against this baseline before any adoption).
  one_call_per_turn: unchanged. Packs are fetched at mount time (chat load / import), not per turn; per-turn brain search is client-side math.
  sal_ephemeral: unchanged. Knowledge fragments are prompt tier content, rebuilt each turn from the mounted packs.
  memory_axis_untouched: searchScored/cosineSearch signatures and behavior byte-identical; brains are searched by a NEW sibling module (lib/brains.ts). Regression test asserts grepResults identical with and without mounts.
  brains_read_only: no write-back from conversation into packs, ever. Memory must not leak into knowledge — the axes stay separate.
  ingest_model_note: Gemma (local KoboldCPP) runs only at Atlantis build time, offline, and only if not --stub; its outputs (summary/topics/aliases) land as human-editable frontmatter validated by atlantis/schema.py. Curation assistance, not runtime reasoning. Model-generated packs should set provenance honestly (source_type/authority pass through).

naming:                        # immersion contract
  ui_label: Brains             # panel section "MOUNTED BRAINS", modal picker "Mount brains"
  prompt_section: PERSONA KNOWLEDGE
  pack_noun: knowledge pack    # user-facing prose when "brain" reads too cute
  rule: no RAG/TF-IDF/cosine/vector jargon in Sal-visible prompt text or chat UI. Inspector stays technical (label "Knowledge"). Sal sees fragments tagged with brain name + document title only.

brain_pack_contract:           # the ONLY interface between the two repos. Version-gated.
  schema_id: sgc-brain/1
  file: '<id>.json — one pack per file, UTF-8, no NaN/Infinity'
  shape:
    schema: 'sgc-brain/1'      # exact string; SGC rejects anything else
    id: string                 # [a-z0-9-]{1,64}; filename stem; import overwrites by id
    name: string               # display name
    description: string
    version: string            # pack author's own versioning; display only
    built_at: string           # ISO 8601, stamped by the exporter
    source: { tool: 'atlantis', schema: 'atlantis-salience-v1', stub: boolean }
    chunks:                    # only status == active chunks are exported
      - id: string             # ← chunk_id ({document_slug}_{index:03d})
        title: string          # ← document_title
        text: string           # ← chunk body, 1..8000 chars (import-validated)
        summary: string        # ← summary (stub mode: first sentence of body — harmless duplicate vocabulary)
        topics: string[]       # ← topics[].topic (kebab-case; tokenizer splits on punctuation, so each contributes its words)
        aliases: string[]      # ← aliases dict FLATTENED: every key AND value as separate strings. THE load-bearing field — deterministic synonym bridge across the author gap. Hand-editable in frontmatter before export.
        source: { file: string, doc: string, position: number }   # ← source_file, document_slug, navigation.current
        tokens: number         # ← tokens (estimate; used for inspector display only)
  dropped_fields_note: salience.*, goal_affinity, utility, provenance.*, temporal.*, navigation.next/previous, related_chunks, index_ref are NOT in v1 of the pack — re-add via schema bump (sgc-brain/2) if retrieval weighting ever wants them. Do not smuggle them in untyped.

