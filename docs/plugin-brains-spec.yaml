resolved_decisions:
  - id: D1-lexical-only-runtime
    decision: v1 consumes packs with the tfidf.ts primitives; Chroma/embeddings never cross the contract. Phase 2b (embedding retrieval) is a separate spec that must beat this baseline on brain-specific eval probes before adoption.
    rationale: keeps the thesis intact and turns the brains axis into a measurable experiment — the Phase 1 model-grepper story run in the forward direction.
  - id: D2-alias-augmented-index
    decision: each chunk indexes tokenize(text + summary + topics + aliases) but PROMPT renders text only (title + text; summary/aliases are retrieval surface, not context payload).
    rationale: aliases/topics/summary repair the cross-author vocabulary gap at index time (the corpus author is not the query author — the inverse of chat memory); rendering them would waste tokens on retrieval scaffolding.
  - id: D3-union-index
    decision: mounting builds ONE union index over all mounted brains' chunks (single IDF), rebuilt deterministically whenever the mount set changes; searchBrains queries the union; per-hit provenance (brainId/brainName) rides on each doc. (Revised 2026-07-02 from per-brain IDF + raw-score merge.)
    rationale: per-shard IDF with raw-score merging is the distributed-IR "collection fusion" problem — scores are incomparable across corpora and the merge biases toward whichever brain finds the query vocabulary exotic. Union IDF measures rarity against everything the persona currently knows, which is the meaningful sense of distinctive. Accepted trade-off — a brain's scores shift slightly with the mount set; deterministic and inspector-visible. Side benefit: signature terms of mutually distinct domain brains regain contrast in the union (rare union-wide → high IDF), so a few coherent domain brains is the mathematical sweet spot (see sizing_guidance).
  - id: D4-concept-only-scoring
    decision: no time dimension for knowledge. KnowledgeResult carries a single score (cosine). searchScored is not involved.
    rationale: every chunk is timeless by nature (time-score.ts:211-214 precedent taken to its limit); routing through the time scorer would multiply everything by 1.0 with extra machinery.
  - id: D5-packs-as-files-bindings-in-db
    decision: packs live as files in <dirname(DB_PATH)>/brains/<id>.json (SGC_BRAINS_DIR overrides); SQLite stores only chat_brains(chat_id, brain_id) bindings. Import = POST full JSON (validated, atomic write, overwrite-by-id). Delete removes file + bindings.
    rationale: packs are multi-MB read-mostly blobs — filesystem, not SQLite rows; deriving the dir from DB_PATH means electron/serverManager.ts needs NO change (it already sets SGC_DB_PATH).
  - id: D6-mount-scope-per-chat
    decision: brains bind per chat (like memories/persona). Picker in ConfirmPersonaModal at "Begin again"; a MOUNTED BRAINS section in MemoryPanel lists mounts with unmount (and mid-chat mount) controls. Deleting a chat cascades its bindings; deleting a brain cascades bindings across chats.
    rationale: matches every existing per-chat scope; mid-chat mount/unmount is deterministic curation, same class as turn gating.
  - id: D7-not-in-naive-baseline
    decision: knowledgeResults are folded into the real prompt only; estimateNaiveContextTokens never sees them.
    rationale: same discipline as the summary buffer and spontaneity — an SGC augmentation a "send everything" pipeline would not have; keeps the Context-Savings tile honest.
  - id: D8-respin-uses-current-mounts
    decision: re-spin passes the CURRENT mounted brain indexes, not a per-turn snapshot.
    rationale: turn-context.ts:10-13 convention — memories/persona/fetchedDocs are caller-supplied and not reconstructed; brains join that list. Snapshotting packs per turn would be storage-absurd.
  - id: D9-stub-first-class
    decision: the exporter and all SGC fixtures use --stub-built packs; source.stub is surfaced in the brain list UI ("model-free build" badge). Gemma-enriched packs differ only in richer aliases/summaries.
    rationale: the developer's explicit want — "without another model in the process, potentially any way" — is a real configuration, not a degraded mode. Hand-authored aliases in frontmatter + re-export = fully deterministic synonym coverage.
  - id: D10-brain-digest
    decision: each mounted brain contributes a compact digest — name, description, document titles, depth-0 topics — rendered ONCE at the top of the PERSONA KNOWLEDGE section every turn a brain is mounted, even when zero chunks retrieve. Derived deterministically client-side from the pack (buildBrainDigest — titles/topics are already in the chunks; no schema change, no Atlantis change). Per-brain cap BRAIN_DIGEST_CHAR_CAP so a fat brain cannot flood the tier.
    rationale: retrieval alone leaves Sal unaware of what it does not know (Core Value #5) — with no hit, a mounted brain is invisible, so Sal cannot say "I have material on X, ask me about it". The digest is also a vocabulary bridge — once Sal and the user can see the corpus's own terms, later queries align with corpus vocabulary, which directly improves lexical retrieval on subsequent turns. Real prompt only (D7 discipline applies).

sizing_guidance:               # answers "few large brains or many small ones"
  principle: a brain is the UNIT OF CONSENT — mounting is the only curation granularity a chat has, so size brains by what a persona should opt into/out of as one decision, not by storage convenience.
  target: domain-sized — one brain = one coherent subject; rule of thumb 10-200 documents / ~100-2000 chunks.
  split_when: the digest no longer fits its cap, or you can imagine ever wanting to mount half of it.
  merge_when: you always mount them together.
  avoid: one mega-brain (no compositionality; its internal IDF flattens its own signature terms) and per-document micro-brains (mounting becomes tedious; digests become the corpus).

type_deltas:
  - file: src/client/lib/types.ts
    add: |
      interface BrainChunk { id: string; title: string; text: string; summary: string; topics: string[]; aliases: string[]; source: { file: string; doc: string; position: number }; tokens: number }
      interface BrainPack { schema: 'sgc-brain/1'; id: string; name: string; description: string; version: string; built_at: string; source: { tool: string; schema: string; stub: boolean }; chunks: BrainChunk[] }
      interface BrainManifest { id: string; name: string; description: string; version: string; built_at: string; stub: boolean; chunkCount: number }   # list-route projection
  - file: src/client/lib/brains.ts        # NEW — sibling of time-score.ts, pure
    add: |
      interface BrainDigest { brainId: string; brainName: string; text: string }                    # capped at BRAIN_DIGEST_CHAR_CAP (D10)
      interface BrainIndex { digests: BrainDigest[]; docs: { chunk: BrainChunk; brainId: string; brainName: string; tf: TFVector }[]; idf: IDFMap }   # ONE union index across mounted packs (D3)
      interface KnowledgeResult { brainId: string; brainName: string; chunkId: string; title: string; text: string; score: number; source: BrainChunk['source'] }
      interface KnowledgeBlock { digests: BrainDigest[]; results: KnowledgeResult[] }               # what the prompt tier consumes
      buildBrainDigest(pack: BrainPack): BrainDigest      # name + description + document titles + depth-0 topics; deterministic, capped
      buildBrainIndex(packs: BrainPack[]): BrainIndex     # union IDF; caller rebuilds whenever the mount set changes
      searchBrains(query: string, index: BrainIndex, topK?: number, threshold?: number): KnowledgeResult[]
  - file: src/client/lib/constants.ts
    add: BRAIN_TOP_K = 3; BRAIN_SCORE_THRESHOLD = 0.08; BRAIN_DIGEST_CHAR_CAP = 600   # same default gate as the grep tier; independent knobs
  - file: src/client/lib/turn-context.ts
    change: TurnContextInput + { brainIndex?: BrainIndex | null }; TurnContextResult + { knowledge: KnowledgeBlock | null }
  - file: src/client/lib/prompt.ts
    change: buildPrompt(..., spontaneityDirective?, knowledge?: KnowledgeBlock | null)   # appended 10th param
  - file: src/client/lib/turn-data.ts
    change: interface KnowledgeDetail { brainName: string; chunkId: string; title: string; score: number; preview: string } beside GrepDetail (line 12); TurnData + { knowledgeDetails: KnowledgeDetail[] | null }
  - file: src/server/db.ts
    add: CREATE TABLE IF NOT EXISTS chat_brains (chat_id INTEGER NOT NULL, brain_id TEXT NOT NULL, PRIMARY KEY (chat_id, brain_id)); helpers getChatBrains(chatId): string[], setChatBrains(chatId, brainIds), deleteBrainBindings(brainId); extend deleteChat cascade
  - repo: C:/projects/Atlantis-SGC
    add: '`python -m atlantis export --out <file> [--id <id>] [--name <name>] [--description <text>] [--pack-version <v>]` — parse Data/chunks/*.md frontmatter, filter status==active, map per brain_pack_contract, stamp built_at + source.stub; _cmd_export in atlantis/__main__.py'

build_steps:                   # ordered; each step leaves tests green
  - 1: 'Atlantis exporter: _cmd_export + field mapping + a test asserting the fixture corpus (tests/fixtures, --stub ingest) exports a schema-valid pack. Commit the exported fixture pack into SGC as src/client/lib/eval/fixtures/brain-fixture.json (small: 3 docs).'
  - 2: 'SGC types.ts additions + lib/brains.ts (buildBrainDigest, buildBrainIndex, searchBrains) + brains.test.ts: index determinism (same packs → same index), UNION semantics (two mounted brains share one IDF; provenance survives per hit; mount-set change → different scores, deterministically), alias retrieval (query hits via alias token only), digest content + cap, threshold/topK, empty-query/empty-pack edges.'
  - 3: 'constants.ts knobs.'
  - 4: 'prompt.ts: PERSONA KNOWLEDGE block — digests header first (renders whenever a brain is mounted, even with zero retrieved chunks — D10), then retrieved fragments (provenance tag "[<brain name> · <title>]", data-not-instructions fencing per linkedBlock model), honesty-clause + TASK-line updates, naive-baseline exclusion. prompt.test.ts: digests-only render (mounted, no hits), digests+fragments render, absent when nothing mounted, absent from naive estimate, fencing text present.'
  - 5: 'turn-context.ts wiring + turn-context.test.ts: knowledge block populated from brainIndex; grepResults BYTE-IDENTICAL with and without brainIndex (the isolation regression).'
  - 6: 'db.ts: chat_brains + helpers + deleteChat cascade; db.test.ts coverage incl. cascade both directions.'
  - 7: 'server routes: GET /api/brains (manifests), GET /api/brains/:id (pack), POST /api/brains (validate schema id, id regex, chunk text 1..8000 chars, atomic write; check/raise JSON body limit), DELETE /api/brains/:id (file + bindings), PUT /api/chats/:id/brains {brainIds}; extend GET /api/chats/:id payload with brainIds.'
  - 8: 'persistence.ts client helpers: listBrains/getBrain/importBrain/deleteBrain/setChatBrains.'
  - 9: 'hooks/useChatSession.ts: mountedBrains state — packs fetched on chat load (hydration/loadChat/startNewChat paths), ONE union index rebuilt on any mount-set change (D3); both assembleTurnContext sites pass brainIndex (hooks/useTurnRunner.ts:138 live, hooks/useResponseEditor.ts:84 re-spin); knowledgeDetails mapping mirrors useTurnRunner.ts:152; TurnData in lib/turn-data.ts; Knowledge tile mirrors components/TurnInspector.tsx:60.'
  - 10: 'UI: ConfirmPersonaModal mount picker (list from GET /api/brains, import button = file input → POST); MemoryPanel MOUNTED BRAINS section (mount/unmount, stub badge).'
  - 11: 'eval: brain probes over the committed fixture pack — pass: direct-term recall@3, alias-bridge recall@3 (query shares zero vocabulary with chunk text, hits via alias); known-gap: synonym absent from text AND aliases (per AGENTS.md probe rules). Ratchet alongside existing suite.'
  - 12: 'docs: CLAUDE.md project-structure + architecture note (knowledge axis ≠ memory axis), changelog entry, archive this spec to docs/ignored/ per convention.'

verification:
  - npm test && npm run typecheck && npm run lint — all green, eval ratchet not lowered
  - manual: import fixture pack → mount on a fresh chat → ask an UNRELATED question → digest header present, zero fragments, Sal can name what the brain covers → ask a kimura-grip question → fragments present, inspector Knowledge tile shows brain/chunk/score → unmount → same question retrieves nothing, digest gone → memory tiers behave identically throughout
  - re-spin a knowledge-bearing turn → knowledge tier reassembles from current mounts (D8), history tiers reproduce exactly as before

out_of_scope:                  # each needs its own raised-first spec
  - embedding/Chroma retrieval (Phase 2b — must beat this baseline on the brain probes)
  - digest-based deterministic router (collection selection — match query against digests, search only the winning brain; the scaling path if mounted-brain counts ever grow past a handful. Still no model; premature at v1 scale)
  - per-chunk gating inside a brain (v1 mounts/unmounts whole brains; curate chunks in Atlantis frontmatter)
  - retrieval weighting by salience/goal_affinity/authority fields (needs sgc-brain/2)
  - cross-chat memory retrieval (different axis entirely)
  - pack authoring UI inside SGC (Atlantis is the compiler; SGC only consumes)
