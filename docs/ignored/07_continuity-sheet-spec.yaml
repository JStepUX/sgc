spec: Continuity sheet — durable, low-salience scene facts that the buffers drop and the grep never scores
status: implemented                # 2026-09-07 — design agreed in session (James + Claude); read and agreed item-by-item 2026-09-07; S0–S6 built the same day; Codex (gpt-5.6-sol) adversarial review 2026-09-07 → storage redesigned to deltas + fold (see review_2026-09-07); unlanded. Schema seeded from James's brainstorm list (a starting point, not gospel); deviations in schema_vs_brainstorm; knowledge slot decided as `unaware_of`.
date: 2026-09-07
goal: >
  Give Sal a per-chat continuity sheet — story, location, and one record per
  named character (presence, apparel, items, position, physical state,
  disposition) — produced as deltas by the EXISTING post-reply state turn,
  merged by code, stored on the turn snapshot beside inner state, and rendered
  into every main prompt above the summary buffer. Zero user interaction:
  no editor, no confirm, correction is diegetic. First-class over Dynamic
  State: renders above it, serialises before it, survives when it doesn't.

why_this_tier_exists:         # the selection criterion — the test for whether a SLOT belongs on the sheet; never a category list in the prompt
  criterion: a fact holds until an event changes it, later replies must stay consistent with it, and neither buffer nor a topical search can reconstruct it (rarely the topic, rarely restated)
  leak_today: "TurnSummary.persistent ('true until explicitly changed', src/client/lib/types.ts:6) reaches the prompt verbatim for LOCAL_BUFFER_SIZE=4 entries then distilled for SUMMARY_BUFFER_SIZE=4 more (src/client/lib/constants.ts:14,29), then never again — a four-turn horizon on a label that promises permanence"
  passes: [ apparel, items in hand, immediate location, stance, injuries, disposition toward the user, who is present / who left and why, time of day, established weather ]
  fails:  [ momentary mood (volatile — summary buffer), what was said (local buffer / grep), background crowds and ambient decoration (regenerable from location type), plot beats ]

invariant_check:
  new_api_call: none — rides the state turn (spec 03). Base loop stays 2 calls/turn, worst case 4 with recall.
  model_in_retrieval: none — the sheet is written by the state turn and READ by a backward scan (newestSheet, mirror of newestDynamicState at src/client/lib/dynamic-state.ts:98); no scoring, no corpus, no search.
  sal_ephemeral: unchanged — the sheet is DATA rendered into a rebuilt-fresh prompt, same argument as dynamic-state.ts header lines 14-17.
  recurrence_bound: >
    DIFFERENT from Dynamic State and must be documented as such (types.ts:25-30 and dynamic-state.ts:19-21 say inner state is bounded by
    per-turn regeneration; the sheet is NOT regenerated — it accretes by design). Its bounds are: fixed schema (slot count is the cap),
    per-slot char cap, character-record cap, deltas-only (omission never deletes, so a lazy or truncated model output cannot blank it),
    and diegetic correction (user correction outranks narration).
  no_gate: the state turn stays non-blocking (state-turn.ts header lines 17-22). The next turn reads the newest COMPLETED sheet; one-turn staleness is accepted exactly as for inner state. Do NOT reintroduce a composer gate.
  naive_baseline: the sheet renders in the real prompt only, never in estimateNaiveContextTokens (same D7 discipline as summary buffer / knowledge / inner state, prompt.ts:150-151).

prerequisite:
  spec_06_S1_only: >
    docs/06_turn-pipeline-seams-spec.yaml trigger fires: this feature is "a 15th positional parameter on buildPrompt"
    (prompt.ts had 14 positionals). Land spec 06 step S1 (buildPrompt(input: PromptInput), prompt-snapshot diff empty) as S0 below.
    S2–S5 of spec 06 stay unscheduled — the sheet does not ride TurnResult/RespinResult and is not a per-turn draw.

