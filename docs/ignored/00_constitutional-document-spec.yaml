spec: constitutional document — the memory chips become one freeform per-chat text, with carry-forward at Begin Again
status: implemented           # 2026-07-05 — built same day (orchestrated waves); hardened post-review: migration clamp to MAX_CONSTITUTIONAL_CHARS, startNewChat create-failure recovery, useConstitutionalDoc split (ratchet)
date: 2026-07-05
goal: >
  Replace the Memory[] chip list (M1/M2/M3 cards + single-line add input) with
  ONE freeform constitutional document per chat: 2-3 paragraphs of prose,
  edited in a modal textarea (sibling of the persona editor), rendered
  verbatim into the CONSTITUTIONAL MEMORIES prompt block. "Begin again" gains
  a carry-forward step: the outgoing chat's document is offered (editable,
  default on when non-empty) so a new chat doesn't start from a blank
  biography. Commit fully (Core Value 4): the memories table is REPLACED by a
  text column — no blob-in-one-row half-measure.

invariant_check:
  tier_preserved: constitutional memory remains Tier 1 — user-curated durable facts, distinct from persona (identity, swappable, operator-authored) by contract; only the container changes (list → document). The model still never scores, grades, or writes it.
  no_model_anywhere: pure UI/storage/prompt-shape change. Retrieval untouched; one call per turn untouched.
  per_chat_scoping_kept: "about me" legitimately differs per relationship (co-worker chat vs conversational partner — decided 2026-07-05). Carry-forward is an explicit, editable COPY at chat birth, not shared state; chats stay sealed units (delete cascades, nothing global).
  sequencing: land BEFORE 01_deliberate-recall-spec.yaml — both edit prompt.ts; recall's anchors (buildPrompt signature, absence marker site) should be written against this final shape.

