spec: dynamic state — post-reply "tidy" call (turn summary + persona internal state), inspector card + editable state
status: proposed              # 2026-08-02 — developer decided direction in-session; recurrence accepted WITH user curation (see D2)
date: 2026-08-02
goal: >
  After each reply finishes streaming, run one small second model call (the
  "state turn") that returns BOTH the turn summary (moving the <turn-summary>
  contract OUT of the main prompt — the RP reply sheds its format burden) and
  a bounded persona internal-state JSON ("Dynamic State"). The state persists
  per assistant turn, feeds the NEXT prompt as a private-state block, and is
  user-editable from the inspector rail, where the Dynamic State card takes
  over the Turn Summary card's slot. Provider-agnostic (plain call, no tools —
  works on LOCAL).

invariant_check:
  sal_ephemeral: unchanged — the state is DATA rendered into a rebuilt-fresh prompt, not a model instance carrying state. Every turn still starts a fresh Sal.
  retrieval_untouched: searchScored / searchBrains / tfidf.ts byte-identical. The state turn retrieves nothing; it only distills.
  call_count_raise: base loop becomes 2 calls/turn (main + state), worst case 4 with recall. Raised and accepted 2026-08-02 — same class as deliberate recall (spec 01); the guardrail is the architecture, not the count (CLAUDE.md Mission Brief).
  recurrence_accepted: >
    the state prompt consumes the PREVIOUS state (a deliberate recurrence —
    unlike turn summaries, which never consume prior summaries). Accepted for
    RP continuity 2026-08-02 with three bounds: size (schema-capped, ~350
    tokens), per-turn regeneration from live context (not an accreting doc),
    and USER CURATION — the state is visible and editable in the rail
    (DynamicStateModal), so the drift surface is also a control surface.
  naive_baseline_honest: the state block and the state call's tokens stay OUT of estimateNaiveContextTokens and out of TurnData.inputTokens (same D7 discipline as summary buffer / knowledge / spontaneity).
  server_untouched: zero server changes — the state turn rides POST /api/turn; persistence rides the existing PATCH /api/chats/:id/turns/:turnId (persistence.ts:239-250 updateTurn, inspectorJson overwrite).

current_state:
  summary_production:
    contract_written: src/client/lib/prompt.ts:302-323      # TURN SUMMARY tail + <turn-summary> OUTPUT FORMAT — appended after EVERY persona
    contract_read: src/client/lib/turn-parser.ts             # parseTurnResponse / stripStreamingMeta / coerceSummary (internal, lines 50-59)
    live_turn_parse: src/client/hooks/useTurnRunner.ts:221-234   # parseTurnResponse on cross-round concatenation; turnData.summary
    promote_and_persist: src/client/hooks/useTurnRunner.ts:236-289  # promote (239-252) → setLatestTurn (255) → fire-and-forget saveTurn chain (265-289, returns {userId, assistantId})
    respin_parse: src/client/hooks/useResponseEditor.ts:126      # re-spin parses summary from main text; saveEdit builds nextInspector (147-239)
    summary_buffer_render: src/client/lib/prompt.ts:137-163      # EARLIER CONTEXT reads entry.summary — consumption side, UNCHANGED by this spec
  persistence:
    save: src/client/lib/persistence.ts:185-190              # saveTurn → {userId, assistantId}
    patch: src/client/lib/persistence.ts:239-250             # updateTurn PATCH content + optional inspectorJson — REUSED as-is for the post-hoc state write... see D5 wrinkle (content required)
    rehydrate: src/client/lib/turn-data.ts:100-126           # replayEntry + summaryFromInspector — the pattern dynamicStateFromInspector copies
  types:
    turn_summary: src/client/lib/types.ts:14-18
    chat_entry: src/client/lib/types.ts:21-79                # summary?: TurnSummary at 69 — dynamicState rides beside it
    turn_data: src/client/lib/turn-data.ts:39-82             # summary at 53; apiCalls at 81
  assembly:
    assembler: src/client/lib/turn-context.ts:72-129          # assembleTurnContext — derives everything history-shaped from priorLog; state derivation lands here
    build_prompt_sig: src/client/lib/prompt.ts:74-87          # positional args; new param appends
  ui:
    summary_card: src/client/components/TurnInspector.tsx:238-271  # the "Turn Summary" card — the slot the Dynamic State card takes over
    summary_line: src/client/components/AssistantMessage.tsx       # dimmed one-line summary under the reply — UNCHANGED (still renders once the state turn lands)
    composition_root: src/client/SalienceGatedCognition.tsx   # owns modal open/close flags — DynamicStateModal flag lands here
  tests_pinning_old_contract:
    - src/client/lib/prompt.test.ts                           # asserts the TURN SUMMARY tail — assertions move to the state-prompt builder's test
    - src/server/db.test.ts                                   # references <turn-summary> in fixtures only — verify, likely untouched

resolved_decisions:
  - id: D1-one-mechanism-always-on
    decision: the state turn runs after EVERY completed live turn, all chats, both providers. The <turn-summary> tail leaves buildPrompt entirely — summary production has exactly one path. No per-chat toggle.
    rationale: a toggle means two summary-production paths forever (Core Value 4). The call is small (schema-capped output); on LOCAL it is free. parseTurnResponse STAYS in the main-turn pipeline as a scrubber (legacy rows + habit-emitting models), its summary result unused.
  - id: D2-recurrence-with-curation
    decision: previous state IS an input to the state prompt (continuity is the RP point), balanced by user curation — the rail shows the current state and DynamicStateModal edits it in place.
    rationale: option 2 from the 2026-08-02 design conversation. Stateless regeneration loses slow-burn continuity; windowing without visibility hides drift. Editable-and-visible turns the drift surface into a control surface.
  - id: D3-state-rides-the-assistant-entry
    decision: DynamicState persists inside the turn's inspector_json (TurnData.dynamicState) and rehydrates onto ChatEntry.dynamicState — byte-for-byte the summary pattern (types.ts:69, turn-data.ts:119-126).
    rationale: undo (deleteLatestTurn) rolls state back for free; the prompt's "previous state" = newest state in priorLog, so a re-spin's sliced history reproduces what that turn saw; no new tables, no new columns.
  - id: D4-prompt-injection-diegetic
    decision: >
      buildPrompt gains `dynamicState?: DynamicState | null` (appended param).
      Renders AFTER the local buffer (freshest-nearest-task ordering,
      prompt.ts:281-286) as: "YOUR INNER STATE (private — your own state from a
      moment ago. It is yours to feel, not to report: never narrate, quote, or
      restate it; let it color what you say and do.)" followed by the state
      flattened to labeled lines (goal / feeling / association / passing
      thought / noticed / impulse — null fields omitted). No JSON reaches Sal.
    rationale: JSON in-prompt leaks JSON into prose on small models; the privacy fence stops verbatim narration; late placement weights it like the present moment it describes.
  - id: D5-fire-after-promote-never-block
    decision: >
      the state call starts immediately after the reply is promoted (parallel
      with saveTurn). PATCH needs assistantId AND updateTurn requires
      `content` — so the join is:
      Promise.all([saveTurnPromise, stateCallPromise]) → apiUpdateTurn(chatId,
      assistantId, { content: displayText, inspectorJson: JSON.stringify(mergedTurnData) })
      → stamp summary+dynamicState onto the in-memory entries (match on
      turnStartedAt, same stamp pattern as useTurnRunner.ts:279-284) →
      setLatestTurn(merged). Failures console.warn and leave the turn
      summary-less/state-less — never surface, never retry, never block.
    rationale: mirrors the existing non-blocking persist discipline (useTurnRunner.ts:261-264). content=displayText is a no-op rewrite; acceptable to keep the server untouched.
  - id: D6-race-degrades-to-last-completed
    decision: no queue, no await. If the user submits turn N+1 before turn N's state lands, N+1 assembles from the newest COMPLETED state in priorLog (possibly N-1's) and N's state still persists when it lands.
    rationale: the composer must never wait on a background call; a one-turn-stale inner state is diegetically fine (moods lag).
  - id: D7-state-prompt-content
    decision: >
      buildStatePrompt(persona, constitutional, recentEntries, prevState,
      spontaneityDirective) → { system, user }. system = persona + the
      constitutional document + previous state (JSON) + the last
      STATE_CONTEXT_SIZE=6 entries INCLUDING the just-finished pair + (when the
      turn fired an operator) one line naming the injected directive so the
      state absorbs the perturbation instead of fighting it. user = the update
      instruction + combined schema. Field rules are the developer's 2026-08-02
      draft with two amendments: the 180-280-token target is DROPPED (word caps
      per field do the work; small models can't count tokens) and the schema
      example uses type-hinted placeholders ("goal": "<one sentence, max 30
      words>") not empty strings (small models echo empty templates).
    schema_returned: |
      { "turn_summary": { "persistent": [], "volatile": [], "established_patterns": [] },
        "internal_state": { "goal": "", "appraisal": "", "association": null,
                            "passing_thought": null, "noticed": [], "unexpressed_impulse": null } }
  - id: D8-tolerant-parse-never-throws
    decision: >
      parseStateResponse(raw) → { summary: TurnSummary | null, state:
      DynamicState | null }. Strip code fences → slice first "{" to last "}" →
      JSON.parse (one completeJson retry, reusing turn-parser's mechanism) →
      coerce per-field: strings trimmed + hard-capped at 400 chars, noticed
      coerced via the toStringList pattern + capped at 3 items, missing/wrong
      types → null/[]. Reuses coerceSummary for the summary half —
      EXPORT it from turn-parser.ts (currently internal at lines 50-59).
      Any failure at any stage → both halves null. Never throws.
  - id: D9-saveEdit-reruns-the-state-turn
    decision: after ANY saveEdit (manual or re-spin), persist first exactly as today (summary+state cleared in nextInspector), then fire the same background state-call→PATCH→stamp chain for the new text. RespinResult loses its summary field (the main text no longer carries one).
    rationale: a hand-crafted RP reply deserves a real summary+state as much as a streamed one; one post-save hook covers both branches. The stale-state-clearing keeps the persist-first failure semantics clean.
  - id: D10-dynamic-state-card-takes-the-summary-slot
    decision: >
      TurnInspector: the "Turn Summary" card (238-271) becomes the DYNAMIC
      STATE card — same rail slot, one card, both outputs of the state turn.
      Layout: "Dynamic State" header + [ Edit ] button (rail-styles button
      idiom) opening DynamicStateModal; the state fields as labeled lines
      (null fields omitted — goal/appraisal near-always present); then the
      existing three summary lists (persistent/volatile/patterns, unchanged
      markup 248-269) below a subtle divider. In-flight: a dimmed
      "reflecting…" line in the card; empty (no state yet, e.g. legacy turns):
      "(no state yet — forms after the next turn)". UI copy says "Dynamic
      State"; "state turn"/"tidy" never reach the user (diegetic naming rule).
      Card render condition widens from summary-only to
      summary-or-state-or-in-flight.
  - id: D11-edit-modal-writes-latest-turn
    decision: DynamicStateModal — one field per schema key (noticed = 3 single-line inputs), seeded from the latest assistant entry's state. Save = apiUpdateTurn on that entry (content unchanged, inspectorJson with dynamicState replaced) → stamp in-memory logs → setLatestTurn. Disabled when no persisted assistant turn exists. Null-out = clearing a field to empty.
  - id: D12-inspector-accounting
    decision: TurnData gains `dynamicState?: DynamicState | null` and `stateTokens?: { input: number; output: number }`; apiCalls increments by 1 when the state call succeeds. Main inputTokens/outputTokens untouched (Context-Savings tile stays a memory-curation comparison). stateTokens render as a small dimmed footer line inside the D10 card — no separate tile.
  - id: D13-stale-state-has-no-horizon
    decision: the assembler takes the NEWEST assistant entry in priorLog carrying a dynamicState, however old (a failed state call must not blank the persona's inner life; the next successful call refreshes it). Scan is a cheap backward loop in assembleTurnContext.

design:
  new_files:
    - file: src/client/lib/dynamic-state.ts
      purpose: pure module — DynamicState type is HERE-adjacent (type itself in types.ts beside TurnSummary), buildStatePrompt (D7), parseStateResponse (D8), flattenStateForPrompt (D4's labeled lines), STATE_CONTEXT_SIZE. No React, no network.
    - file: src/client/lib/dynamic-state.test.ts
      purpose: parser tolerance (fenced / prose-wrapped / truncated / wrong-typed / junk → nulls, caps enforced), builder determinism, prev-state + operator-line inclusion, flattener null-omission.
    - file: src/client/components/DynamicStateModal.tsx
      purpose: D11. Modal pattern per ConstitutionalEditorModal.
  modified_files:
    - file: src/client/lib/types.ts
      change: "add DynamicState interface (goal/appraisal: string; association/passing_thought/unexpressed_impulse: string|null; noticed: string[]) beside TurnSummary; ChatEntry gains dynamicState?: DynamicState (doc comment mirrors summary's at 64-69, plus: consumed by the next prompt's inner-state block)"
    - file: src/client/lib/turn-parser.ts
      change: export coerceSummary (50-59) and completeJson for dynamic-state.ts; nothing else moves — the scrubber role stays
    - file: src/client/lib/prompt.ts
      change: DELETE the TURN SUMMARY tail + OUTPUT FORMAT block (302-323, and the task line-2 at 304); ADD dynamicState param + YOUR INNER STATE block after localBlock (D4); estimateNaiveContextTokens does NOT pass it (invariant)
    - file: src/client/lib/turn-context.ts
      change: derive latestDynamicState from priorLog (D13), pass to buildPrompt; TurnContextResult unchanged
    - file: src/client/lib/turn-data.ts
      change: TurnData fields (D12); dynamicStateFromInspector() mirroring summaryFromInspector (119-126); replayEntry wires it (100-111)
    - file: src/client/hooks/useTurnRunner.ts
      change: >
        after promote (252): fire runTurn with buildStatePrompt output (no
        tools, no-op onDelta, same confirmedProvider); join with the saveTurn
        promise per D5; expose a stateInFlight boolean for the rail's
        "reflecting…" hint. turnData.summary now comes from parseStateResponse,
        not parseTurnResponse (which stays as scrubber). ~50 lines; 315 today,
        default budget 500 — no ratchet risk.
    - file: src/client/hooks/useResponseEditor.ts
      change: RespinResult drops summary; saveEdit clears summary+dynamicState in nextInspector then fires the shared post-save state chain (D9) — extract the chain from useTurnRunner into dynamic-state.ts-adjacent helper or a tiny shared hook if line budgets complain
    - file: src/client/components/TurnInspector.tsx
      change: D10 — the Turn Summary card (238-271) becomes the Dynamic State card (state fields + [ Edit ] + summary lists + D12's stateTokens footer); props gain dynamicState, stateInFlight, onOpenStateEditor, stateEditorDisabled. 275 lines today, default budget 500 — headroom fine.
    - file: src/client/SalienceGatedCognition.tsx
      change: DynamicStateModal open/close flag + prop plumbing (composition root only, no logic)
  tests:
    - prompt.test.ts: retarget tail assertions — main prompt asserts the tail is ABSENT + inner-state block renders/omits correctly; contract assertions move to dynamic-state.test.ts
    - LOCAL-path sanity pass before landing — the inner-state block is every-turn prompt copy, and small local models take always-on copy harder (AGENTS.md, v1.3.0 plot-loss regression); verify a local-provider RP chat doesn't narrate or fixate on the injected state
    - turn-context.test.ts: isolation regression stays green by construction (no retrieval change); add a case pinning D13 (newest state wins, gaps skipped)
    - db.test.ts: verify fixtures only; expected untouched
  docs:
    claude_md: architecture section — turn-summary paragraph rewritten (summary now produced by the post-reply state turn alongside Dynamic State); Mission Brief call-count line gains the 2026-08-02 raise; Project Structure one-liners for the three new files
    readme: Dynamic State section (what it is, that it is editable, that it is a deliberate recurrence with curation)
    changelog: docs/changelogs/ entry on land
  out_of_scope:
    - per-chat toggle (D1 kills it; revisit only if Anthropic-cost complaints materialize)
    - state history / versioning (latest-only; the log lines in old inspector_json blobs ARE the history if ever needed)
    - feeding state into retrieval or the grep corpus (it is prompt-side color, never a memory tier)
